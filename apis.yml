url: https://raw.githubusercontent.com/api-evangelist/fumadocs/refs/heads/main/apis.yml
apis:
- aid: fumadocs:fumadocs
  name: Fumadocs
  tags:
  - Documentation
  - Framework
  - Next.js
  humanURL: https://fumadocs.dev
  properties:
  - url: https://fumadocs.dev/docs
    type: Documentation
  - url: https://github.com/fuma-nama/fumadocs
    type: GitHub
  description: >-
    Fumadocs is an open-source documentation framework built on Next.js and React for creating fast, modern
    developer documentation sites. It provides a full stack of composable packages including fumadocs-core
    for source loading, page tree generation, and search; fumadocs-ui for pre-built accessible React components,
    themes, and layouts; fumadocs-openapi for generating interactive API reference pages from OpenAPI
    specifications with a built-in playground; and a CLI for scaffolding new projects.
- aid: fumadocs:fumadocs-proxy-api
  name: Fumadocs Proxy API
  description: >-
    HTTP proxy endpoints that forward requests to external API servers on behalf of the browser-based
    OpenAPI playground to avoid CORS issues.
  humanURL: https://fumadocs.dev
  tags:
  - Proxy
  properties:
  - type: OpenAPI
    url: openapi/fumadocs-proxy-api-openapi.yml
  - type: Documentation
    url: https://fumadocs.dev/docs/headless/search/orama
  - type: JSONSchema
    url: json-schema/fumadocs-search-result-schema.json
  - type: Documentation
    url: https://fumadocs.dev/docs/ui/openapi
- aid: fumadocs:fumadocs-search-api
  name: Fumadocs Search API
  description: >-
    Search endpoints for querying documentation content. Results include pages, headings, and text segments
    ranked by relevance.
  humanURL: https://fumadocs.dev
  tags:
  - Search
  properties:
  - type: OpenAPI
    url: openapi/fumadocs-search-api-openapi.yml
  - type: Documentation
    url: https://fumadocs.dev/docs/headless/search/orama
  - type: JSONSchema
    url: json-schema/fumadocs-search-result-schema.json
  - type: Documentation
    url: https://fumadocs.dev/docs/ui/openapi
